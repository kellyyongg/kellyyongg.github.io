<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>index</title>

    <style>
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Crimson Text', serif;
        }

        p {
            font-family: 'Work Sans', sans-serif;
        }

        #container {
            background-color: white;
            max-width: 1280px;
            margin: auto;
            padding-left: 40px;
            padding-right: 40px;
        }

        #nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #74c69d;
            max-width: 1280px;
            margin: auto;
            padding-left: 60px;
            padding-right: 60px;
        }

        .logo {
            display: flex;
            justify-content: space-between;
            align-items: center;

        }

        .logo img {
            width: 200px;
            margin-right: 10px;
        }

        .menu {
            font-family: 'Work Sans', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            color: white;
            font-size: 16px;
        }

        .menu a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="nav">
            <div class="logo"><img src="img/logo.png"></div>
            <div class="menu">
                <a href="#">Home</a>
                <a href="#">Portfolio</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </div>
        </div>


</body>

</html>
