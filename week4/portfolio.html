<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>index</title>

    <style>
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Crimson Text', serif;
        }

        p {
            font-family: 'Work Sans', sans-serif;
        }

        #container {
            background-color: white;
            max-width: 1280px;
            margin: auto;
            padding-left: 40px;
            padding-right: 40px;
        }

        #nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #74c69d;
            max-width: 1280px;
            margin: auto;
            padding-left: 60px;
            padding-right: 60px;
        }

        .logo {
            display: flex;
            justify-content: space-between;
            align-items: center;

        }

        .logo img {
            width: 200px;
            margin-right: 10px;
        }

        .menu {
            font-family: 'Work Sans', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            color: white;
            font-size: 16px;
        }

        .menu a {
            color: white;
            text-decoration: none;
        }

        .portfolio {
            text-align: center;
            padding: 50px 0;
        }

        .portfolio h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .portfolio p {
            font-size: 18px;
            color: #555;
            max-width: 800px;
            margin: auto;
            margin-bottom: 40px;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            justify-content: center;
            max-width: 900px;
            margin: auto;
        }

        .portfolio-item img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="nav">
            <div class="logo"><img src="img/logo.png"></div>
            <div class="menu">
                <a href="#">Home</a>
                <a href="#">Portfolio</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </div>
        </div>
        <section class="portfolio">
            <h2>Portfolio</h2>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>

            <div class="portfolio-grid">
                <div class="portfolio-item"><img src="img/1.svg"></div>
                <div class="portfolio-item"><img src="img/2.svg"></div>
                <div class="portfolio-item"><img src="img/3.svg"></div>
                <div class="portfolio-item"><img src="img/4.svg"></div>
                <div class="portfolio-item"><img src="img/5.svg"></div>
                <div class="portfolio-item"><img src="img/6.svg"></div>
                <div class="portfolio-item"><img src="img/7.svg"></div>
                <div class="portfolio-item"><img src="img/8.png"></div>
            </div>


</body>

</html>
