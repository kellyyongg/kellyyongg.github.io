<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link rel="stylesheet" href="general.css">

    <style>
        body {
            margin: 0;
        }

        #container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0;

        }

        #navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: #EBC603;
        }

        #logo {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        #menu a {
            color: black;
            text-decoration: none;
            font-size: 16px;
            padding: 10px 20px;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="navbar">
            <div id="logo">
                <img src="img/logo.png" alt="Logo" width="100" height="100">
            </div>
            <div id="menu">
                <a href="#">Sarawak Chinese Food</a>
                <a href="#">Signature Dish</a>
                <a href="#">About Sarawak</a>
                <a href="#">Recipe</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </div>
</body>

</html>
