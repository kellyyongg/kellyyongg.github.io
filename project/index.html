<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link rel="stylesheet" href="general.css">

    <style>
        body {
            margin: 0;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0;
            background-color: #F5F5DC;
            height: 100vh;
        }

        #navbar {
            position: fixed;
            top: 0;
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: #EBC603;
            z-index: index 100;
            padding: 15px 0;

        }

        #menu {
            display: flex;
            justify-content: space-between;
            align-items: center;

        }

        #menu a {
            color: black;
            text-decoration: none;
            font-size: 18px;
            padding: 15px 20px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div id="navbar">
            <div id="logo">
                <img src="img/logo.png" alt="Logo" width="70" height="70">
            </div>
            <div id="menu">
                <a href="#">Sarawak Chinese Food</a>
                <a href="#">Signature Dish</a>
                <a href="#">About Sarawak</a>
                <a href="#">Recipe</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </div>
</body>

</html>
