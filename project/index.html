<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link rel="stylesheet" href="general.css">

    <style>
        body {
            margin: 0;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 0;
            background-color: #F5F5DC;
            height: 100vh;
        }

        #navbar {
            position: fixed;
            top: 0;
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: #EBC603;
            z-index: 10;
            padding: 15px 0;

        }

        #menu {
            display: flex;
            justify-content: space-between;
            align-items: center;

        }

        #menu a {
            color: black;
            text-decoration: none;
            font-size: 18px;
            padding: 15px 20px;
        }

        .homepagebanner {

            text-align: center;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .homepagebanner img {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .homepagebanner h1 {
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            margin: 0;
            z-index: 2;
        }

        .homepagebanner h5 {
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            margin: 10px 0;
            z-index: 2;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div id="navbar">
            <div id="logo">
                <img src="img/logo.png" alt="Logo" width="70" height="70">
            </div>
            <div id="menu">
                <a href="#">Sarawak Chinese Food</a>
                <a href="#">Signature Dish</a>
                <a href="#">About Sarawak</a>
                <a href="#">Recipe</a>
                <a href="#">Contact</a>
            </div>
        </div>
        <div class="homepagebanner">
            <div>
                <img src="img/alottypesfoos.png" alt="A lot of types of food">
                <h1>Sarawak Welcomes You!!</h1>
                <h5>Taste The Heart Of Sarawak!</h5>
            </div>
        </div>
</body>

</html>
