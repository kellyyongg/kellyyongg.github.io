<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>

    <title>index</title>
    <link rel="stylesheet" href="general.css">

    <style>
        #container {
            background-color: white;
            max-width: 1280px;
            margin: auto;
            padding-left: 40px;
            padding-right: 40px;
        }



        .menu {
            font-family: 'Work Sans', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            color: white;
            font-size: 16px;
        }

        .menu a {
            color: white;
            text-decoration: none;
        }

        .portfolio h3 {
            color: #74c69d;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 14px;
        }

        .portfolio {
            text-align: center;
            padding: 50px 60px;
            max-width: 1280px;
            margin: auto;
        }

        .portfolio h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .portfolio p {
            font-size: 18px;
            color: #555;
            max-width: 800px;
            margin: auto;
            margin-bottom: 40px;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            justify-content: center;
            max-width: 1160px;
            margin: auto;
        }

        .portfolio-item img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .dark-button {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 40px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Work Sans', sans-serif;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="nav">
            <div class="logo"><img src="img/logo.png"></div>
            <div class="menu">
                <a href="#">Home</a>
                <a href="#">Portfolio</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </div>
        </div>
        <section class="portfolio">
            <h3>Works</h3>
            <h2>Portfolio</h2>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>

            <div class="portfolio-grid">
                <div class="portfolio-item"><img src="img/1.svg"></div>
                <div class="portfolio-item"><img src="img/2.svg"></div>
                <div class="portfolio-item"><img src="img/3.svg"></div>
                <div class="portfolio-item"><img src="img/4.svg"></div>
                <div class="portfolio-item"><img src="img/5.svg"></div>
                <div class="portfolio-item"><img src="img/6.svg"></div>
                <div class="portfolio-item"><img src="img/7.svg"></div>
                <div class="portfolio-item"><img src="img/8.png"></div>
            </div>
            <div class="button-container">
                <button class="dark-button">Learn More</button>
            </div>
        </section>
        <div class="footer">
            <div class="social-icons">
                <img src="img/facebook.svg" alt="Facebook">
                <img src="img/instagram.svg" alt="Instagram">
                <img src="img/twitter.svg" alt="Twitter">
                <img src="img/pinterest.svg" alt="Pinterest">
                <img src="img/tktok.svg" alt="TikTok">
                <img src="img/whatsapp.svg" alt="WhatsApp">
                <img src="img/youtube.svg" alt="YouTube">
            </div>
            <div class="copyright">
                &copy; 2023 by Company. Proudly created with HTML & CSS.
            </div>
        </div>
</body>

</html>
